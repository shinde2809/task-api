[package]
name = "task-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "task-api"
path = "src/main.rs"

[lib]
name = "task_api"
path = "src/lib.rs"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
dotenv = "0.15"
thiserror = "1"
anyhow = "1"
dashmap = "5"
sha2 = "0.10"
hex = "0.4"
actix-web-httpauth = "0.8"
futures = "0.3"
env_logger = "0.11"

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }
